name: Build iOS (TrollStore)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Install ldid
        run: brew install ldid

      - name: Generate native iOS project
        run: |
          npx expo prebuild --platform ios --clean --no-install
          echo "--- Contents of ios/ ---"
          ls ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build without signing
        run: |
          xcodebuild build \
            -workspace ios/ProjectSalah.xcworkspace \
            -scheme ProjectSalah \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Show what's inside the app
        run: |
          APP=build/Build/Products/Release-iphoneos/ProjectSalah.app
          echo "--- PlugIns ---"
          ls "$APP/PlugIns"

      - name: Add entitlements with ldid
        run: |
          APP=build/Build/Products/Release-iphoneos/ProjectSalah.app
          ldid -Sci/ProjectSalahMonitor.entitlements \
            "$APP/PlugIns/ProjectSalahMonitor.appex/ProjectSalahMonitor"
          ldid -Sci/ProjectSalah.entitlements "$APP/ProjectSalah"

      - name: Show entitlements
        run: |
          APP=build/Build/Products/Release-iphoneos/ProjectSalah.app
          echo "--- Extension ---"
          ldid -e "$APP/PlugIns/ProjectSalahMonitor.appex/ProjectSalahMonitor"
          echo "--- App ---"
          ldid -e "$APP/ProjectSalah"

      - name: Package as .tipa and .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ProjectSalah.app Payload/
          zip -qr ProjectSalah.tipa Payload
          cp ProjectSalah.tipa ProjectSalah.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: |
            ProjectSalah.tipa
            ProjectSalah.ipa